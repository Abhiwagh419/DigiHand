<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Handwritten-to-Digital</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --chalkboard: #2b3b34;
    --chalkboard-line: #3d4f47;
    --chalk-white: #eef0ea;
    --chalk-yellow: #f4d35e;
    --paper: #f7f3e8;
    --paper-line: #d9d2bd;
    --ink-red: #b5493c;
    --ink-green: #4a7c59;
    --text-dark: #2b2b26;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    background: var(--paper);
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }

  .title {
    font-family: 'Kalam', cursive;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--text-dark);
    margin: 0 0 4px;
    text-align: center;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #7a7565;
    margin-bottom: 28px;
    text-align: center;
    max-width: 480px;
    line-height: 1.5;
  }

  .layout {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 920px;
    width: 100%;
  }

  .board-panel {
    background: var(--chalkboard);
    border-radius: 6px;
    padding: 18px;
    box-shadow: 0 10px 0 -4px rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.25);
    position: relative;
  }

  .board-panel::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(238,240,234,0.15);
    border-radius: 3px;
    pointer-events: none;
  }

  #canvas {
    background: var(--chalkboard);
    border-radius: 3px;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  .board-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  .hint {
    color: rgba(238,240,234,0.5);
    font-size: 0.72rem;
  }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 0.8rem;
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  button:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--chalk-yellow);
    color: #3a2f10;
    box-shadow: 0 3px 0 #c9a63f;
  }
  .btn-primary:active { box-shadow: 0 1px 0 #c9a63f; }

  .btn-secondary {
    background: transparent;
    color: var(--chalk-white);
    border: 1px solid rgba(238,240,234,0.35);
  }

  .results-panel {
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 20px 22px;
    width: 340px;
    min-height: 340px;
    position: relative;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 27px,
      var(--paper-line) 28px
    );
  }

  .results-label {
    font-family: 'Kalam', cursive;
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0 0 14px;
    color: var(--text-dark);
  }

  .char-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
    min-height: 40px;
  }

  .char-chip {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background: white;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 4px 9px;
    font-size: 1.05rem;
    font-weight: 600;
    position: relative;
  }

  .char-chip .conf {
    font-size: 0.55rem;
    font-weight: 400;
    color: #9a927c;
    margin-top: 1px;
  }

  .char-chip.low-conf { border-color: var(--ink-red); }
  .char-chip.low-conf .conf { color: var(--ink-red); }

  .reconstructed {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--text-dark);
    margin-bottom: 14px;
    word-break: break-all;
    min-height: 34px;
  }

  .result-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1rem;
    color: var(--ink-green);
    font-weight: 600;
  }

  .result-line .checkmark {
    color: var(--ink-red);
    font-family: 'Kalam', cursive;
    font-size: 1.3rem;
  }

  .empty-state {
    color: #b0a98f;
    font-size: 0.8rem;
    font-style: italic;
    margin-top: 40px;
    text-align: center;
  }

  .status {
    font-size: 0.72rem;
    color: #9a927c;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <h1 class="title">Handwritten-to-Digital</h1>
  <p class="subtitle">
    Write digits, letters, or a math expression on the board. Each character
    gets segmented and read individually — like a tutor checking your work stroke by stroke.
  </p>

  <div class="layout">
    <div class="board-panel">
      <canvas id="canvas" width="480" height="320"></canvas>
      <div class="board-controls">
        <span class="hint">draw with mouse or touch</span>
        <div style="display:flex; gap:8px;">
          <button class="btn-secondary" id="clearBtn">Clear</button>
          <button class="btn-primary" id="readBtn">Read it</button>
        </div>
      </div>
    </div>

    <div class="results-panel">
      <p class="results-label">What I read</p>
      <div class="char-row" id="charRow"></div>
      <div class="reconstructed" id="reconstructed"></div>
      <div id="resultLine"></div>
      <div class="empty-state" id="emptyState">Nothing read yet — draw something and hit "Read it".</div>
      <div class="status" id="status"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#2b3b34';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.lineWidth = 14;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = '#eef0ea';

let drawing = false;
let lastX = 0, lastY = 0;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top) * (canvas.height / rect.height)
  };
}

function startDraw(e) {
  drawing = true;
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  e.preventDefault();
}

function draw(e) {
  if (!drawing) return;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x; lastY = p.y;
  e.preventDefault();
}

function stopDraw() { drawing = false; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('mouseleave', stopDraw);
canvas.addEventListener('touchstart', startDraw);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', stopDraw);

document.getElementById('clearBtn').addEventListener('click', () => {
  ctx.fillStyle = '#2b3b34';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  document.getElementById('charRow').innerHTML = '';
  document.getElementById('reconstructed').textContent = '';
  document.getElementById('resultLine').innerHTML = '';
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('status').textContent = '';
});

const BACKEND_URL = 'http://localhost:5000/predict'; // change if hosted elsewhere

document.getElementById('readBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Reading...';

  const dataUrl = canvas.toDataURL('image/png');

  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl })
    });
    const data = await res.json();
    renderResult(data);
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = 'Could not reach backend — is Flask running on port 5000?';
    console.error(err);
  }
});

function renderResult(data) {
  const charRow = document.getElementById('charRow');
  const reconstructed = document.getElementById('reconstructed');
  const resultLine = document.getElementById('resultLine');
  const emptyState = document.getElementById('emptyState');

  charRow.innerHTML = '';
  resultLine.innerHTML = '';

  if (!data.characters || data.characters.length === 0) {
    emptyState.style.display = 'block';
    emptyState.textContent = 'Nothing detected — try writing bigger or with more spacing.';
    reconstructed.textContent = '';
    return;
  }
  emptyState.style.display = 'none';

  data.characters.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'char-chip' + (c.confidence < 0.6 ? ' low-conf' : '');
    chip.innerHTML = `${c.char}<span class="conf">${Math.round(c.confidence * 100)}%</span>`;
    charRow.appendChild(chip);
  });

  reconstructed.textContent = data.text;

  if (data.expression_result !== null && data.expression_result !== undefined) {
    resultLine.innerHTML = `<span class="checkmark">✓</span> = ${data.expression_result}`;
  }
}
</script>

</body>
</html>
